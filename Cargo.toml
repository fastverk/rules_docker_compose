[workspace]
resolver = "2"
members = ["compose/private/compose_gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependency pins. There's only one workspace member today
# (compose_gen) but keeping versions in the workspace makes adding a
# second crate later — or matching pins to rules_jsonschema's — a
# one-line edit.
[workspace.dependencies]
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# typify-generated code references `::regress::Regex` by absolute
# path, so the consumer of the generated library has to declare regress
# as a direct dep too.
regress = "0.10"
